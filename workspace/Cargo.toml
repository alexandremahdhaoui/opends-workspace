[workspace]
resolver = "2"
members = ["opends-spec", "opends-core", "opends-app"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mockall = "0.15"
windows = "0.62"
eframe = { version = "0.32", default-features = false, features = ["glow"] }
egui = "0.32"
