name: opends-workspace

artifactStorePath: .forge/artifact-store.yaml

build:
  - name: sync
    src: ./workspace
    engine: go://generic-builder
    spec:
      command: sh
      args: ["hack/sync.sh", ".."]

test:
  - name: validate
    runner: go://generic-test-runner
    spec:
      command: sh
      args: ["hack/validate.sh"]
